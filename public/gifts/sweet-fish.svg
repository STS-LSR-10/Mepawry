<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- ปลาหวาน: a flat sheet of sweet dried fish, glazed orange-red with chilli flakes and sesame -->
  <defs>
    <radialGradient id="glaze" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#F2A04A"/>
      <stop offset="0.55" stop-color="#D9662A"/>
      <stop offset="1" stop-color="#A9401C"/>
    </radialGradient>
    <linearGradient id="tail" x1="0" x2="1">
      <stop offset="0" stop-color="#C95726"/>
      <stop offset="1" stop-color="#9A3A1A"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-14 64 64)">
    <!-- tail -->
    <path d="M96 62 C106 50 116 44 122 42 C118 54 118 70 122 84 C114 82 105 76 96 68 Z" fill="url(#tail)"/>
    <!-- body: a wide, slightly wavy slab -->
    <path d="M10 64 C14 42 36 30 60 30 C80 30 94 46 98 62 C94 80 80 96 58 98 C34 98 14 86 10 64 Z" fill="url(#glaze)"/>
    <!-- wavy crisp edge -->
    <path d="M14 58 C18 44 34 35 52 34 M18 80 C26 90 40 95 56 94" fill="none" stroke="#F6C07A" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <!-- glossy highlight -->
    <ellipse cx="44" cy="52" rx="20" ry="8" fill="#FFE0A8" opacity="0.35"/>
    <!-- chilli flakes -->
    <g fill="#8E2A12">
      <circle cx="30" cy="62" r="2"/><circle cx="48" cy="72" r="1.6"/><circle cx="62" cy="58" r="2.2"/>
      <circle cx="74" cy="76" r="1.8"/><circle cx="38" cy="80" r="1.5"/><circle cx="80" cy="60" r="1.6"/>
      <circle cx="56" cy="44" r="1.4"/><circle cx="24" cy="72" r="1.3"/><circle cx="68" cy="88" r="1.4"/>
    </g>
    <!-- sesame -->
    <g fill="#FFF3D9">
      <ellipse cx="36" cy="68" rx="2.2" ry="1.2" transform="rotate(30 36 68)"/>
      <ellipse cx="54" cy="64" rx="2.2" ry="1.2" transform="rotate(-20 54 64)"/>
      <ellipse cx="70" cy="68" rx="2.2" ry="1.2" transform="rotate(45 70 68)"/>
      <ellipse cx="46" cy="84" rx="2.2" ry="1.2" transform="rotate(10 46 84)"/>
      <ellipse cx="66" cy="48" rx="2.2" ry="1.2" transform="rotate(-35 66 48)"/>
      <ellipse cx="84" cy="70" rx="2.2" ry="1.2" transform="rotate(15 84 70)"/>
    </g>
  </g>
</svg>
